    <circle cx="462" cy="361" r="3.5" fill="#c58c70" />
    <text x="476" y="367" fill="#d5d2cf" font-size="17">Create and organize project files</text>
    <circle cx="462" cy="400" r="3.5" fill="#c58c70" />
    <text x="476" y="406" fill="#d5d2cf" font-size="17">Save work locally per project</text>
    <circle cx="462" cy="439" r="3.5" fill="#c58c70" />
    <text x="476" y="445" fill="#d5d2cf" font-size="17">Keep execution in the sandbox</text>

    <rect x="815" y="177" width="355" height="355" rx="15" fill="#101010" stroke="#303030" stroke-width="2" />
    <rect x="840" y="201" width="112" height="27" rx="13.5" fill="#1a1a1a" />
    <text x="855" y="219" fill="#c6c0bc" font-size="13" font-weight="700" letter-spacing="1.2">V3 · PLANNED</text>
    <text x="840" y="269" fill="#f0eeeb" font-size="23" font-weight="700">Local services + voice</text>
    <path d="M840 289 H1145" stroke="#2b2b2b" />
    <circle cx="847" cy="322" r="3.5" fill="#c58c70" />
    <text x="861" y="328" fill="#d5d2cf" font-size="17">Flask and FastAPI exercises</text>
    <circle cx="847" cy="361" r="3.5" fill="#c58c70" />
    <text x="861" y="367" fill="#d5d2cf" font-size="17">HTTP APIs and WebSockets</text>
    <circle cx="847" cy="400" r="3.5" fill="#c58c70" />
    <text x="861" y="406" fill="#d5d2cf" font-size="17">Voice to editable task requests</text>
    <circle cx="847" cy="439" r="3.5" fill="#c58c70" />
    <text x="861" y="445" fill="#d5d2cf" font-size="17">Networking allowed per task</text>

    <rect x="1200" y="177" width="355" height="355" rx="15" fill="#101010" stroke="#303030" stroke-width="2" />
    <rect x="1225" y="201" width="112" height="27" rx="13.5" fill="#1a1a1a" />
    <text x="1240" y="219" fill="#c6c0bc" font-size="13" font-weight="700" letter-spacing="1.2">V4 · PLANNED</text>
    <text x="1225" y="269" fill="#f0eeeb" font-size="24" font-weight="700">Integrated builds</text>
    <path d="M1225 289 H1530" stroke="#2b2b2b" />
    <circle cx="1232" cy="322" r="3.5" fill="#c58c70" />
    <text x="1246" y="328" fill="#d5d2cf" font-size="17">Dashboards and chatbots</text>
    <circle cx="1232" cy="361" r="3.5" fill="#c58c70" />
    <text x="1246" y="367" fill="#d5d2cf" font-size="17">Image-generation clients</text>
    <circle cx="1232" cy="400" r="3.5" fill="#c58c70" />
    <text x="1246" y="406" fill="#d5d2cf" font-size="17">Mock or local service APIs</text>
    <circle cx="1232" cy="439" r="3.5" fill="#c58c70" />
    <text x="1246" y="445" fill="#d5d2cf" font-size="17">Longer end-to-end projects</text>
  </g>

  <path d="M72 564 H1528" stroke="#292929" />
  <text x="800" y="587" text-anchor="middle" fill="#bdb8b4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">YOU WRITE EVERY LINE  ·  AI STAYS OPTIONAL  ·  PRACTICE STAYS LOCAL  ·  NO SCORES OR ANSWER KEYS</text>
</svg>
